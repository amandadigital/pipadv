<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded notebook paper tile -->
  <rect width="64" height="64" rx="14" fill="#faf7ee" stroke="#d5cebd" stroke-width="2"/>
  <!-- Notebook lines -->
  <line x1="6" y1="20" x2="58" y2="20" stroke="rgba(60,50,40,0.09)" stroke-width="1.5"/>
  <line x1="6" y1="36" x2="58" y2="36" stroke="rgba(60,50,40,0.09)" stroke-width="1.5"/>
  <line x1="6" y1="52" x2="58" y2="52" stroke="rgba(60,50,40,0.09)" stroke-width="1.5"/>
  <!-- Red notebook margin -->
  <line x1="18" y1="0" x2="18" y2="64" stroke="rgba(220,70,70,0.22)" stroke-width="1.5"/>
  
  <!-- Pip Character -->
  <!-- Legs -->
  <line x1="33" y1="45" x2="27" y2="56" stroke="#2b2926" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="45" x2="40" y2="56" stroke="#2b2926" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="33" y1="33" x2="33" y2="45" stroke="#2b2926" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cute Scarf trailing -->
  <path d="M 30 33 Q 22 32 15 35" stroke="#c93434" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 30 34.5 Q 24 37 19 40" stroke="#c93434" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Scarf neck loop & knot -->
  <ellipse cx="33" cy="33" rx="4.5" ry="2" fill="#c93434" stroke="#8b1e1e" stroke-width="1"/>
  <circle cx="30" cy="33.5" r="1.6" fill="#c93434"/>
  <!-- Head -->
  <circle cx="33" cy="23" r="6.5" fill="#faf7ee" stroke="#2b2926" stroke-width="2.5"/>
  <!-- Eye -->
  <circle cx="35.5" cy="22" r="1.3" fill="#2b2926"/>
  <!-- Tiny cute pencil in hand -->
  <line x1="33" y1="38" x2="44" y2="34" stroke="#2b2926" stroke-width="2" stroke-linecap="round"/>
  <polygon points="44,34 50,32 47,38" fill="#d99011"/>
  <polygon points="50,32 53,31 49,35" fill="#2b2926"/>
</svg>
