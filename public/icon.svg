<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded notebook paper tile -->
  <rect width="512" height="512" rx="110" fill="#faf7ee" stroke="#d5cebd" stroke-width="16"/>
  <!-- Notebook lines -->
  <line x1="48" y1="160" x2="464" y2="160" stroke="rgba(60,50,40,0.08)" stroke-width="12"/>
  <line x1="48" y1="288" x2="464" y2="288" stroke="rgba(60,50,40,0.08)" stroke-width="12"/>
  <line x1="48" y1="416" x2="464" y2="416" stroke="rgba(60,50,40,0.08)" stroke-width="12"/>
  <!-- Red notebook margin -->
  <line x1="140" y1="0" x2="140" y2="512" stroke="rgba(220,70,70,0.2)" stroke-width="12"/>
  <!-- Binder holes -->
  <circle cx="80" cy="120" r="18" fill="rgba(60,50,40,0.08)"/>
  <circle cx="80" cy="256" r="18" fill="rgba(60,50,40,0.08)"/>
  <circle cx="80" cy="392" r="18" fill="rgba(60,50,40,0.08)"/>
  
  <!-- Pip Character -->
  <!-- Legs -->
  <line x1="270" y1="360" x2="220" y2="445" stroke="#2b2926" stroke-width="20" stroke-linecap="round"/>
  <line x1="270" y1="360" x2="330" y2="445" stroke="#2b2926" stroke-width="20" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="270" y1="265" x2="270" y2="360" stroke="#2b2926" stroke-width="20" stroke-linecap="round"/>
  <!-- Cute Scarf trailing in wind -->
  <path d="M 245 268 Q 185 260 120 285" stroke="#c93434" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 245 282 Q 195 305 150 330" stroke="#c93434" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Scarf neck loop & knot -->
  <ellipse cx="270" cy="265" rx="36" ry="16" fill="#c93434" stroke="#8b1e1e" stroke-width="8"/>
  <circle cx="245" cy="270" r="14" fill="#c93434"/>
  <!-- Head -->
  <circle cx="270" cy="180" r="52" fill="#faf7ee" stroke="#2b2926" stroke-width="20"/>
  <!-- Eye -->
  <circle cx="290" cy="172" r="10" fill="#2b2926"/>
  <!-- Tiny cute pencil in hand -->
  <line x1="270" y1="305" x2="360" y2="270" stroke="#2b2926" stroke-width="16" stroke-linecap="round"/>
  <polygon points="360,270 410,250 385,300" fill="#d99011"/>
  <polygon points="410,250 435,240 400,275" fill="#2b2926"/>
</svg>
